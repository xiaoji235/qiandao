name: WPS Daily Sign-In

on:
  schedule:
    - cron: '30 0 * * *'  # 每天 UTC 0:30 执行 (北京时间 8:30)
  workflow_dispatch:      # 允许手动触发

jobs:
  sign-in:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests pycryptodome
      
      - name: Run WPS sign-in
        env:
          WPS_USER_ID: ${{ secrets.WPS_USER_ID }}
          WPS_SID: ${{ secrets.WPS_SID }}
        run: |
          python wps.py
      
      - name: Upload sign-in log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-log
          path: log/wps.txt  # 修改为 wps.txt
      
      - name: Commit and push log file
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add log/wps.txt
          git diff --staged --quiet || git commit -m "Update WPS sign-in log [skip ci]"
          git push
